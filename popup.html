<!doctype html>
<meta charset="utf-8">
<title>YouTube ショートブロッカー</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 248px; margin: 0; padding: 16px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  h1 { margin: 0 0 12px; font-size: 13px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .state { font-size: 12px; opacity: .75; }
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track {
    position: absolute; inset: 0; border-radius: 13px;
    background: #bbb; transition: background .15s; pointer-events: none;
  }
  .track::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: transform .15s;
  }
  input:checked + .track { background: #cc0000; }
  input:checked + .track::after { transform: translateX(18px); }
  input:focus-visible + .track { outline: 2px solid Highlight; outline-offset: 2px; }
  p { margin: 12px 0 0; font-size: 11px; opacity: .6; }
</style>

<h1>YouTube ショートブロッカー</h1>
<div class="row">
  <span class="state" id="state">読み込み中…</span>
  <label class="switch">
    <input type="checkbox" id="toggle">
    <span class="track"></span>
  </label>
</div>
<p id="note">開いているYouTubeのタブにも即座に反映されます。</p>
<script src="popup.js"></script>
